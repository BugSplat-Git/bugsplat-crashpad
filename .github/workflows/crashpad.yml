# Crashpad prebuilt farm.
#
# Builds Crashpad at ONE pinned commit for every platform bugsplat-native ships on, packages each
# build as a sha256-pinned tarball (scripts/farm/package.sh) and publishes them as a GitHub
# pre-release tagged crashpad-<commit7> together with crashpad.lock, which bugsplat-native's
# cmake/FetchCrashpadPrebuilt.cmake reads. Bumping Crashpad = change CRASHPAD_COMMIT_PINNED below
# (or pass a commit to workflow_dispatch), run the workflow, copy the new crashpad.lock into
# bugsplat-native/cmake/.
#
# Toolchain notes (learned the hard way in bugsplat-native's CI):
#  - the pinned Crashpad compiles as C++23, so runners need clang >= 17 / Xcode >= 16 / MSVC >= 14.43
#  - on Windows the depot_tools launchers are .bat files; scripts/farm/build.ps1 drives them from
#    pwsh one `cmd /c "call x.bat"` at a time so every exit code is checked
#  - GN args go through args.gn, never shell quoting
name: crashpad

on:
  workflow_dispatch:
    inputs:
      crashpad_commit:
        description: Crashpad commit to build (defaults to the pinned CRASHPAD_COMMIT_PINNED)
        required: false
        default: ""
      publish:
        description: Publish a GitHub pre-release with the tarballs and crashpad.lock
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/crashpad.yml
      - scripts/farm/**

env:
  CRASHPAD_COMMIT_PINNED: db44314646cbd0825a73b58dd2b7b5f4faca64a7   # 2026-09-07; bump deliberately

jobs:
  pin:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
      short: ${{ steps.pin.outputs.short }}
    steps:
      - id: pin
        shell: bash
        run: |
          c="${{ github.event.inputs.crashpad_commit }}"
          [ -n "$c" ] || c="$CRASHPAD_COMMIT_PINNED"
          echo "commit=$c" >> "$GITHUB_OUTPUT"
          echo "short=${c:0:7}" >> "$GITHUB_OUTPUT"
          echo "Building Crashpad $c"

  build:
    needs: pin
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Windows: clang-cl from Crashpad's DEPS against the runner's MSVC STL (/MD) ---------
          - name: windows-x64
            os: windows-2022
            builds: |
              win-x64|is_debug=false target_cpu="x64" extra_cflags="/MD"
            targets: client handler:crashpad_handler crashpad_wer snapshot minidump util
          - name: windows-x86
            os: windows-2022
            builds: |
              win-x86|is_debug=false target_cpu="x86" extra_cflags="/MD"
            targets: client handler:crashpad_handler crashpad_wer snapshot minidump util
          - name: windows-arm64
            os: windows-2022
            builds: |
              win-arm64|is_debug=false target_cpu="arm64" extra_cflags="/MD"
            targets: client handler:crashpad_handler crashpad_wer snapshot minidump util
          # ---- macOS universal (arm64 + x86_64 lipo'd); 12.0 is the floor: mac_util.cc uses kIOMainPortDefault
          - name: macos-universal
            os: macos-15
            builds: |
              mac-arm64|is_debug=false target_cpu="arm64" mac_deployment_target="12.0"
              mac-x64|is_debug=false target_cpu="x64" mac_deployment_target="12.0"
            universal: mac-arm64 mac-x64
            targets: client handler:crashpad_handler snapshot minidump util
          # ---- Linux: socket transport so the handler never needs libcurl --------------------------
          - name: linux-x86_64
            os: ubuntu-24.04
            builds: |
              linux-x64|is_debug=false crashpad_http_transport_impl="socket"
            targets: client handler:crashpad_handler snapshot minidump util
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            builds: |
              linux-arm64|is_debug=false target_cpu="arm64" crashpad_http_transport_impl="socket"
            targets: client handler:crashpad_handler snapshot minidump util
          # ---- Android: NDK from the runner image, API 26 (bugsplat-android's minSdk) --------------
          - name: android-arm64-v8a
            os: ubuntu-24.04
            android: true
            builds: |
              android-arm64|is_debug=false target_os="android" target_cpu="arm64" android_api_level=26 crashpad_http_transport_impl="socket"
            targets: client handler:crashpad_handler snapshot minidump util
          - name: android-armeabi-v7a
            os: ubuntu-24.04
            android: true
            builds: |
              android-arm|is_debug=false target_os="android" target_cpu="arm" android_api_level=26 crashpad_http_transport_impl="socket"
            targets: client handler:crashpad_handler snapshot minidump util
          - name: android-x86_64
            os: ubuntu-24.04
            android: true
            builds: |
              android-x64|is_debug=false target_os="android" target_cpu="x64" android_api_level=26 crashpad_http_transport_impl="socket"
            targets: client handler:crashpad_handler snapshot minidump util
          # ---- iOS / tvOS: in-process client only (no handler targets exist on iOS); static libs need no signing
          - name: ios-device
            os: macos-15
            builds: |
              ios-device-arm64|is_debug=false target_os="ios" target_cpu="arm64" target_environment="device" ios_deployment_target="14.0" ios_enable_code_signing=false
            targets: client snapshot minidump util
          - name: ios-simulator
            os: macos-15
            builds: |
              ios-sim-arm64|is_debug=false target_os="ios" target_cpu="arm64" target_environment="simulator" ios_deployment_target="14.0" ios_enable_code_signing=false
              ios-sim-x64|is_debug=false target_os="ios" target_cpu="x64" target_environment="simulator" ios_deployment_target="14.0" ios_enable_code_signing=false
            universal: ios-sim-arm64 ios-sim-x64
            targets: client snapshot minidump util
          - name: tvos-device
            os: macos-15
            builds: |
              tvos-device-arm64|is_debug=false target_os="ios" target_platform="tvos" target_cpu="arm64" target_environment="device" ios_deployment_target="14.0" ios_enable_code_signing=false
            targets: client snapshot minidump util
          - name: tvos-simulator
            os: macos-15
            builds: |
              tvos-sim-arm64|is_debug=false target_os="ios" target_platform="tvos" target_cpu="arm64" target_environment="simulator" ios_deployment_target="14.0" ios_enable_code_signing=false
              tvos-sim-x64|is_debug=false target_os="ios" target_platform="tvos" target_cpu="x64" target_environment="simulator" ios_deployment_target="14.0" ios_enable_code_signing=false
            universal: tvos-sim-arm64 tvos-sim-x64
            targets: client snapshot minidump util
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    env:
      CRASHPAD_COMMIT: ${{ needs.pin.outputs.commit }}
      # Matrix strings go through env: the GN args carry double quotes that would break a shell
      # or PowerShell literal if they were pasted into the script body.
      BUILDS: ${{ matrix.builds }}
      TARGETS: ${{ matrix.targets }}
      UNIVERSAL: ${{ matrix.universal }}
      NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        shell: bash
        run: |
          {
            echo "runner=${{ matrix.os }}"
            if [[ "$RUNNER_OS" == "macOS" ]]; then xcodebuild -version | tr '\n' ' '; echo; clang --version | head -1; fi
            if [[ "$RUNNER_OS" == "Linux" ]]; then clang --version | head -1; ldd --version 2>/dev/null | head -1; fi
            if [[ "${{ matrix.android }}" == "true" ]]; then echo "ndk=$(sed -n 's/^Pkg.Revision *= *//p' "$ANDROID_NDK_LATEST_HOME/source.properties")"; fi
          } | tee toolchain.txt

      - name: Build (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/farm/*.sh
          extra=""
          if [[ "${{ matrix.android }}" == "true" ]]; then extra=" android_ndk_root=\"$ANDROID_NDK_LATEST_HOME\""; fi
          while IFS='|' read -r out args; do
            [ -n "$out" ] || continue
            scripts/farm/build.sh "$GITHUB_WORKSPACE/work" "$CRASHPAD_COMMIT" "$out" "$args$extra" $TARGETS
          done <<< "$BUILDS"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lines = $env:BUILDS -split "`n" | Where-Object { $_.Trim() -ne "" }
          foreach ($line in $lines) {
            $out, $gnargs = $line -split '\|', 2
            & scripts/farm/build.ps1 -Work "$env:GITHUB_WORKSPACE\work" -Commit $env:CRASHPAD_COMMIT -Out $out.Trim() -ArgsGn $gnargs.Trim() -Targets $env:TARGETS
          }

      - name: Universal (lipo)
        if: matrix.universal != ''
        shell: bash
        run: |
          set -- $UNIVERSAL
          scripts/farm/lipo.sh "$GITHUB_WORKSPACE/work/crashpad" "$1" "$2" universal

      - name: Package
        shell: bash
        run: |
          if [ -n "$UNIVERSAL" ]; then out=universal; else out=$(head -1 <<< "$BUILDS" | cut -d'|' -f1); fi
          py=python3; command -v python3 >/dev/null 2>&1 || py=python
          meta=$($py -c 'import json; print(json.dumps({"toolchain": open("toolchain.txt").read().strip().splitlines()}))')
          bash scripts/farm/package.sh "$GITHUB_WORKSPACE/work/crashpad" "$out" "$NAME" "$GITHUB_WORKSPACE/dist" "$meta"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: crashpad-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [pin, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: crashpad-${{ needs.pin.outputs.short }}
      COMMIT: ${{ needs.pin.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify checksums and write crashpad.lock
        shell: bash
        run: |
          cd artifacts
          sha256sum -c -- *.sha256
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          python3 - "$COMMIT" "$TAG" "$base" <<'PY'
          import json, sys, glob, os
          commit, tag, base = sys.argv[1:4]
          short = commit[:7]
          artifacts = {}
          for sha in sorted(glob.glob("*.tar.xz.sha256")):
              digest, name = open(sha).read().split()
              name = name.lstrip("*")
              key = name[len(f"crashpad-{short}-"):-len(".tar.xz")]
              artifacts[key] = {"file": name, "sha256": digest, "size": os.path.getsize(name), "url": f"{base}/{name}"}
          lock = {"schemaVersion": 1, "commit": commit, "release": tag, "baseUrl": base, "artifacts": artifacts}
          json.dump(lock, open("crashpad.lock", "w"), indent=2)
          print(open("crashpad.lock").read())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: crashpad.lock
          path: artifacts/crashpad.lock

      - name: Publish pre-release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
        shell: bash
        run: |
          cd artifacts
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "${{ github.repository }}" --cleanup-tag --yes
          fi
          {
            echo "Crashpad prebuilt libraries at commit \`$COMMIT\`, built by workflow run ${{ github.run_id }}."
            echo
            echo "Consumed by [bugsplat-native](https://github.com/BugSplat-Git/bugsplat-native) through \`crashpad.lock\` (\`cmake/FetchCrashpadPrebuilt.cmake\`)."
            echo "Each tarball mirrors a Crashpad checkout: headers, \`out/release/obj/**\` static libraries, \`out/release/gen/**\`, \`PREBUILT.json\` with the exact GN args and toolchain."
            echo
            echo "| artifact | sha256 |"; echo "|---|---|"
            for f in *.tar.xz; do echo "| $f | $(cut -d' ' -f1 "$f.sha256") |"; done
          } > notes.md
          gh release create "$TAG" --repo "${{ github.repository }}" --target "$GITHUB_SHA" --prerelease \
            --title "Crashpad $TAG" --notes-file notes.md *.tar.xz *.sha256 crashpad.lock
          echo "https://github.com/${{ github.repository }}/releases/tag/$TAG"
